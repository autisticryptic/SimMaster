[from-linphone]
exten => 41000,1,NoOp(Linphone to SimAdmin trunk)
 same => n,Set(CALLERID(num)=6108)
 same => n,Dial(PJSIP/41000@41000,60)
 same => n,Hangup()

exten => _+X.,1,NoOp(Linphone E.164 call through SimAdmin)
 same => n,Set(CALLERID(num)=6108)
 same => n,Dial(PJSIP/${EXTEN}@41000,60)
 same => n,Hangup()

exten => _X.,1,NoOp(Linphone numeric call through SimAdmin)
 same => n,Set(CALLERID(num)=6108)
 same => n,Dial(PJSIP/${EXTEN}@41000,60)
 same => n,Hangup()

exten => 6000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-simadmin]
exten => 6108,1,NoOp(SimAdmin operator call to Linphone)
 same => n,Dial(PJSIP/6108,45,b(simadmin-lab-autoanswer^s^1))
 same => n,Hangup()

[simadmin-lab-autoanswer]
exten => s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:autoanswer@localhost>;answer-after=0)
 same => n,Return()

[simadmin-lab-test]
exten => 41000,1,NoOp(Automated SimAdmin trunk call)
 same => n,Set(CALLERID(num)=6108)
 same => n,Dial(PJSIP/41000@41000,20)
 same => n,Hangup()

; ===== SMS bridging dialplan =====
; res_pjsip_messaging routes SIP MESSAGE into the endpoint's message_context.
; Messages received from the SimAdmin trunk endpoint (41000) are forwarded to
; the Linphone endpoint (6108); messages from Linphone are forwarded to the
; trunk. ${MESSAGE(from)} preserves the original sender for SimAdmin.
[simadmin-linphone-msg]
exten => _X.,1,MessageSend(PJSIP/41000,${MESSAGE(from)})
 same => n,Hangup()

exten => _+X.,1,MessageSend(PJSIP/41000,${MESSAGE(from)})
 same => n,Hangup()

[simadmin-trunk-msg]
exten => _X.,1,MessageSend(PJSIP/6108,${MESSAGE(from)})
 same => n,Hangup()
