[package]
name = "simadmin"
version = "1.1.4"
edition = "2021"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1.48.0", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
tower-http = { version = "0.6.6", features = ["fs", "cors"] }
libc = "0.2"
socket2 = "0.6.1"
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
anyhow = "1.0"
lazy_static = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
md5 = "0.7"
base64 = "0.22.1"
percent-encoding = "2.3.2"
url = "2.5"
ring = "0.17.14"
num-bigint = "0.4"
num-traits = "0.2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
regex-automata = "0.4.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
# The main program configuration is a hand-editable text file, which needs two
# different YAML capabilities. They are deliberately split by risk:
#
#   serde-saphyr  reads it. Parsing decides what the device is configured to do,
#                 so this side uses the mature, serde-native parser: `AppConfig`
#                 deserializes through its own derives, `deny_unknown_fields`
#                 behaves exactly as it does with serde_json, and errors carry
#                 line/column. No hand-written conversion layer sits in the path
#                 where a misparse would silently mis-provision a SIM.
#
#   yaml-edit     writes it, and nothing else. It is the only crate that can
#                 replace one value while preserving operator comments, key
#                 order and blank lines, which `save()` needs because the web UI
#                 rewrites settings on every change. It is young (0.x), so every
#                 write is verified by re-reading with serde-saphyr and
#                 comparing against the intended config; a mismatch restores the
#                 backup instead of leaving a damaged file.
serde-saphyr = "1.1"
yaml-edit = "0.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
