name: Build-Lpac-Compat

# Build compatibility lpac binaries from source for ARM64 and AMD64.

on:
  push:
    paths:
      - '.github/workflows/build-lpac-compat-rebuild.yml'
      - '.github/workflows/.lpac-build-trigger'
  schedule:
    - cron: '0 0 5,20 * *'
  workflow_dispatch:
    inputs:
      lpac_ref:
        description: 'lpac branch or tag (for example v2.3.0 or main)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check:
    name: Check lpac version
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      lpac_ref: ${{ steps.check.outputs.lpac_ref }}
    steps:
      - name: Check for lpac updates
        id: check
        env:
          MANUAL_REF: ${{ inputs.lpac_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OFFICIAL_TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "User-Agent: SimMaster-Actions" https://api.github.com/repos/estkme-group/lpac/releases/latest | jq -r .tag_name)
          if [ -n "$MANUAL_REF" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "lpac_ref=$MANUAL_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUR_MANIFEST=$(curl -sL -f https://github.com/autisticryptic/SimMaster/releases/download/lpac/lpac.json || echo '{}')
          OUR_TAG=$(echo "$OUR_MANIFEST" | jq -r '.version // empty' || true)
          OUR_HAS_APDU_DRIVERS=$(echo "$OUR_MANIFEST" | jq -r '
            (.apdu_drivers // false) as $drivers |
            if ($drivers | type) == "array" then
              (($drivers | index("qmi")) != null)
            else
              ($drivers == true)
            end
          ' || true)
          if [ "$OFFICIAL_TAG" = "$OUR_TAG" ] && [ "$OUR_HAS_APDU_DRIVERS" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "lpac_ref=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build lpac (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            package: lpac-linux-aarch64-glibc2.31.zip
          - arch: x86_64
            runner: ubuntu-24.04
            package: lpac-linux-x86_64-glibc2.31.zip
    steps:
      - name: Checkout SimMaster
        uses: actions/checkout@v4

      - name: Build lpac inside Debian 11 container
        env:
          LPAC_REF: ${{ needs.check.outputs.lpac_ref }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p release
          CONTAINER_NAME="lpac-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          # Keep the build output in the container and copy it out explicitly.
          # This avoids an intermittent Docker bind-mount visibility problem
          # on hosted runners, which previously made upload-artifact see no
          # archive even though the container had created and verified it.
          set +e
          {
            echo "docker path: $(command -v docker || echo missing)"
            docker version 2>&1 || true
          } > release/docker-host.log
          docker run --name "$CONTAINER_NAME" \
            debian:11 bash -s "$LPAC_REF" "$PACKAGE_NAME" > release/docker-run.log 2>&1
          set -eux
          trap 'rc=$?; msg=$(printf "LPAC container failed at line %s: %s (exit %s)" "$LINENO" "$BASH_COMMAND" "$rc" | tr "\n" " "); echo "::error title=LPAC container failure::$msg"; exit "$rc"' ERR
          mkdir -p /output
          # Debian 11 moved to the archive after Bullseye EOL; keep the
          # glibc 2.31 build target while using the archived package index.
          # The archive does not contain a bullseye-security suite, so keep
          # only the archived Bullseye main repository.
          printf "%s\n" "deb [trusted=yes] http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          printf "Acquire::Check-Valid-Until \"false\";\n" > /etc/apt/apt.conf.d/99archive
          apt-get \
            -o Acquire::Check-Valid-Until=false \
            -o Acquire::AllowInsecureRepositories=true \
            update
          apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates zip jq \
            xz-utils pkg-config python3 python3-pip ninja-build \
            libcurl4-openssl-dev libglib2.0-dev \
            libpcsclite-dev libgudev-1.0-dev libudev-dev
          pip3 install meson
          # Install the same QMI 1.36.0 packages used by upstream LPAC's
          # Debian CI.  Building libqmi from source here is unnecessary and
          # made this compatibility workflow depend on fragile archive
          # extraction behavior on the hosted ARM runner.
          QMI_VERSION="1.36.0-1_$(dpkg --print-architecture)"
          QMI_TMP=$(mktemp -d)
          trap 'rm -rf "$QMI_TMP"' EXIT
          for QMI_PACKAGE in \
            libqmi-glib5 \
            libqmi-glib-dev \
            libqmi-utils \
            libqmi-proxy \
            gir1.2-qmi-1.0; do
            curl -fL --retry 5 --retry-delay 3 \
              "https://launchpad.net/ubuntu/+archive/primary/+files/${QMI_PACKAGE}_${QMI_VERSION}.deb" \
              -o "$QMI_TMP/${QMI_PACKAGE}.deb"
          done
          dpkg -i "$QMI_TMP"/*.deb
          ldconfig
          git clone --depth 1 --branch "$0" https://github.com/estkme-group/lpac /lpac
          cd /lpac
          RESOLVED_VER=$(git describe --tags --always || git rev-parse --short HEAD || echo "$0")
          echo "$RESOLVED_VER" > /output/resolved_version.txt
          mkdir build && cd build
          # Keep the compatibility bundle self-contained: lpac 2.3.x links
          # euicc-drivers statically by default.  QMI therefore appears in
          # `driver list` inside the lpac executable; it is not a
          # driver/driver_apdu_qmi.so plugin.
          cmake .. -DCMAKE_BUILD_TYPE=Release -DSTANDALONE_MODE=ON \
            -DLPAC_DYNAMIC_LIBEUICC=OFF -DLPAC_DYNAMIC_DRIVERS=OFF \
            -DLPAC_WITH_APDU_PCSC=ON -DLPAC_WITH_APDU_AT=ON -DLPAC_WITH_APDU_QMI=ON
          make -j$(nproc)
          DESTDIR=/tmp/lpac-install cmake --install .
          BUNDLE_ROOT=/tmp/lpac-bundle
          mkdir -p "$BUNDLE_ROOT/lib"
          LPAC_BIN=$(find /tmp/lpac-install -name lpac -type f | head -1)
          test -n "$LPAC_BIN" && test -f "$LPAC_BIN"
          cp "$LPAC_BIN" "$BUNDLE_ROOT/lpac"
          chmod 755 "$BUNDLE_ROOT/lpac"

          # The static lpac executable still has a runtime dependency on
          # libqmi-glib.  Bundle the SONAME target under lib/ so the device
          # does not need a separately installed libqmi package.
          QMI_SO=$(find /usr/local/lib /usr/lib /lib -type f \
            \( -name 'libqmi-glib.so.5.*' -o -name 'libqmi-glib.so.*.*.*' \) \
            -print -quit || true)
          test -n "$QMI_SO" && test -f "$QMI_SO"
          cp -L "$QMI_SO" "$BUNDLE_ROOT/lib/"
          QMI_BASENAME=$(basename "$QMI_SO")
          ln -sf "$QMI_BASENAME" "$BUNDLE_ROOT/lib/libqmi-glib.so.5"
          ln -sf "$QMI_BASENAME" "$BUNDLE_ROOT/lib/libqmi-glib.so"

          # Confirm the bundled binary can resolve libqmi before packaging.
          DRIVER_LIST=$(LPAC_APDU=stdio LPAC_HTTP=stdio \
            LD_LIBRARY_PATH="$BUNDLE_ROOT/lib" \
            "$BUNDLE_ROOT/lpac" driver list)
          echo "$DRIVER_LIST"
          echo "$DRIVER_LIST" | jq -e '.payload.LPAC_APDU | index("qmi") != null' >/dev/null
          echo "$DRIVER_LIST" | jq -e '.payload.LPAC_HTTP | index("curl") != null' >/dev/null
          ldd "$BUNDLE_ROOT/lpac" || true
          (cd "$BUNDLE_ROOT" && zip -r "/output/$1" .)
          test -f "/output/$1"
          chmod -R 777 /output
          CONTAINER_SCRIPT
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            docker logs "$CONTAINER_NAME" > release/lpac-build.log 2>&1 || true
            cat release/docker-host.log >> release/lpac-build.log || true
            cat release/docker-run.log >> release/lpac-build.log || true
            diagnostic=$(tail -n 40 release/lpac-build.log | tr '\n' ' ' | cut -c1-3000 || true)
            if [ -z "$diagnostic" ]; then
              diagnostic="docker run produced no diagnostic output (exit $build_status)"
            fi
            echo "::error file=.github/workflows/build-lpac-compat-rebuild.yml,line=111::$diagnostic"
            cat release/lpac-build.log || true
            docker rm "$CONTAINER_NAME" || true
            exit "$build_status"
          fi
          docker cp "$CONTAINER_NAME:/output/$PACKAGE_NAME" "release/$PACKAGE_NAME"
          docker cp "$CONTAINER_NAME:/output/resolved_version.txt" release/resolved_version.txt
          docker rm "$CONTAINER_NAME"
          test -s "release/$PACKAGE_NAME"
          test -s release/resolved_version.txt

      # The container build performs the capability checks and asserts that
      # the archive exists before it exits.  Do not repeat a host-side file
      # check here: Docker volume visibility differs between GitHub-hosted
      # runner images (notably the ARM runner), while upload-artifact is the
      # authoritative hand-off to the publish job.

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpac-${{ matrix.arch }}
          path: |
            release/${{ matrix.package }}
            release/resolved_version.txt
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish lpac compatibility assets
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lpac-*
          path: dist
          merge-multiple: false

      - name: Prepare manifest
        env:
          LPAC_REF: ${{ needs.check.outputs.lpac_ref }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lpac-aarch64/*.zip release/
          cp dist/lpac-x86_64/*.zip release/
          VERSION=$(find dist -name resolved_version.txt -print -quit | xargs cat)
          [ -n "$VERSION" ] || VERSION="$LPAC_REF"
          cat > release/lpac.json << EOF
          {
            "version": "$VERSION",
            "apdu_drivers": ["qmi", "pcsc", "at", "stdio"],
            "http_drivers": ["curl", "stdio"],
            "assets": [
              {"name": "lpac-linux-aarch64-glibc2.31.zip", "arch": "aarch64", "glibc": "2.31"},
              {"name": "lpac-linux-x86_64-glibc2.31.zip", "arch": "x86_64", "glibc": "2.31"}
            ]
          }
          EOF

      - name: Upload to SimMaster Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lpac
          name: eSIM lpac Compatibility Assets
          body: |
            Compatibility lpac binaries built from estkme-group/lpac@${{ needs.check.outputs.lpac_ref }}.
            Architectures: aarch64 (ARM64) and x86_64 (AMD64).
          draft: false
          prerelease: true
          make_latest: false
          files: |
            release/lpac-linux-aarch64-glibc2.31.zip
            release/lpac-linux-x86_64-glibc2.31.zip
            release/lpac.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
