name: Build-Lpac-Compat

# Build compatibility lpac binaries from source for ARM64 and AMD64.

on:
  schedule:
    - cron: '0 0 5,20 * *'
  workflow_dispatch:
    inputs:
      lpac_ref:
        description: 'lpac branch or tag (for example v2.3.0 or main)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check:
    name: Check lpac version
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      lpac_ref: ${{ steps.check.outputs.lpac_ref }}
    steps:
      - name: Check for lpac updates
        id: check
        env:
          MANUAL_REF: ${{ inputs.lpac_ref }}
        run: |
          set -euo pipefail
          OFFICIAL_TAG=$(curl -fsSL https://api.github.com/repos/estkme-group/lpac/releases/latest | jq -r .tag_name)
          if [ -n "$MANUAL_REF" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "lpac_ref=$MANUAL_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUR_MANIFEST=$(curl -sL -f https://github.com/autisticryptic/SimMaster/releases/download/lpac/lpac.json || echo '{}')
          OUR_TAG=$(echo "$OUR_MANIFEST" | jq -r '.version // empty' || true)
          if [ "$OFFICIAL_TAG" = "$OUR_TAG" ] && [ -n "$OUR_TAG" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "lpac_ref=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build lpac (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            package: lpac-linux-aarch64-glibc2.31.zip
          - arch: x86_64
            runner: ubuntu-24.04
            package: lpac-linux-x86_64-glibc2.31.zip
    steps:
      - name: Checkout SimMaster
        uses: actions/checkout@v4

      - name: Build lpac inside Debian 11 container
        env:
          LPAC_REF: ${{ needs.check.outputs.lpac_ref }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p release
          docker run --rm \
            -v "$GITHUB_WORKSPACE/release:/output" \
            debian:11 bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake git ca-certificates zip \
                pkg-config python3 python3-pip ninja-build \
                libcurl4-openssl-dev libglib2.0-dev \
                libpcsclite-dev libgudev-1.0-dev libglib2.0-doc \
                libudev-dev udev
              pip3 install meson
              git clone --depth 1 --branch 1.36.0 \
                https://gitlab.freedesktop.org/mobile-broadband/libqmi.git /libqmi-src
              cd /libqmi-src
              meson setup build --prefix=/usr/local --libdir=lib --buildtype=release \
                -Dcollection=full -Dmbim_qmux=false -Dqrtr=false \
                -Dintrospection=false -Dman=false -Dbash_completion=false -Dqmi_username=root
              ninja -C build
              ninja -C build install
              ldconfig
              git clone --depth 1 --branch "$0" https://github.com/estkme-group/lpac /lpac
              cd /lpac
              RESOLVED_VER=$(git describe --tags --always || git rev-parse --short HEAD || echo "$0")
              echo "$RESOLVED_VER" > /output/resolved_version.txt
              mkdir build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release -DSTANDALONE_MODE=ON \
                -DLPAC_WITH_APDU_PCSC=ON -DLPAC_WITH_APDU_AT=ON -DLPAC_WITH_APDU_QMI=ON
              make -j$(nproc)
              DESTDIR=/tmp/lpac-install cmake --install .
              BUNDLE_ROOT=/tmp/lpac-bundle
              mkdir -p "$BUNDLE_ROOT/lib"
              LPAC_BIN=$(find /tmp/lpac-install -name lpac -type f | head -1)
              test -n "$LPAC_BIN" && test -f "$LPAC_BIN"
              cp "$LPAC_BIN" "$BUNDLE_ROOT/lpac"
              chmod 755 "$BUNDLE_ROOT/lpac"
              QMI_SO=$(find /usr/local/lib -name "libqmi-glib.so.*.*.*" -type f | head -1 || true)
              if [ -n "$QMI_SO" ]; then
                cp -L "$QMI_SO" "$BUNDLE_ROOT/lib/"
                QMI_BASENAME=$(basename "$QMI_SO")
                ln -sf "$QMI_BASENAME" "$BUNDLE_ROOT/lib/libqmi-glib.so.5"
                ln -sf "$QMI_BASENAME" "$BUNDLE_ROOT/lib/libqmi-glib.so"
              fi
              ldd "$BUNDLE_ROOT/lpac" || true
              (cd "$BUNDLE_ROOT" && zip -r "/output/$1" .)
              chmod -R 777 /output
            ' "$LPAC_REF" "$PACKAGE_NAME"

      - name: Verify output
        run: |
          ls -lh "release/${{ matrix.package }}"
          file "release/${{ matrix.package }}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpac-${{ matrix.arch }}
          path: |
            release/${{ matrix.package }}
            release/resolved_version.txt
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish lpac compatibility assets
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lpac-*
          path: dist
          merge-multiple: false

      - name: Prepare manifest
        env:
          LPAC_REF: ${{ needs.check.outputs.lpac_ref }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lpac-aarch64/*.zip release/
          cp dist/lpac-x86_64/*.zip release/
          VERSION=$(find dist -name resolved_version.txt -print -quit | xargs cat)
          [ -n "$VERSION" ] || VERSION="$LPAC_REF"
          cat > release/lpac.json << EOF
          {
            "version": "$VERSION",
            "assets": [
              {"name": "lpac-linux-aarch64-glibc2.31.zip", "arch": "aarch64", "glibc": "2.31"},
              {"name": "lpac-linux-x86_64-glibc2.31.zip", "arch": "x86_64", "glibc": "2.31"}
            ]
          }
          EOF

      - name: Upload to SimMaster Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lpac
          name: eSIM lpac Compatibility Assets
          body: |
            Compatibility lpac binaries built from estkme-group/lpac@${{ needs.check.outputs.lpac_ref }}.
            Architectures: aarch64 (ARM64) and x86_64 (AMD64).
          draft: false
          prerelease: true
          make_latest: false
          files: |
            release/lpac-linux-aarch64-glibc2.31.zip
            release/lpac-linux-x86_64-glibc2.31.zip
            release/lpac.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
