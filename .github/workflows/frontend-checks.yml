name: Frontend Checks

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Record UI regression source identity
        run: |
          mkdir -p .ci-reports
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          files = ['package.json', 'pnpm-lock.yaml', 'playwright.lines.config.ts',
                   'src/api/contracts.ts', 'src/pages/sim/LineRuntimeDetails.tsx',
                   'src/pages/sim/ImsExecutionDetails.tsx', 'src/pages/sim/imsDiagnosticsFormat.ts',
                   'src/pages/sim/CarrierProfileEditor.tsx', 'src/pages/sim/ModemLinesPanel.tsx',
                   'src/pages/sim/VowifiLineDialog.tsx', 'src/pages/sim/cellularImsErrorCodes.ts',
                   'src/pages/sim/cellularImsErrorFormat.ts', 'tests/cellularImsErrorFormat.test.ts',
                   'tests/imsDiagnosticsFormat.test.ts', 'e2e/ims-execution-diagnostics.spec.ts',
                   'e2e/blocked-lines.spec.ts', 'e2e/fixtures/lines.tsx']
          report = {'schema': 'ims-execution-ui-v1', 'commit': os.environ['GITHUB_SHA'],
                    'run_id': os.environ['GITHUB_RUN_ID'],
                    'files': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files}}
          pathlib.Path('.ci-reports/source.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Policy and execution-fact unit tests
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee .ci-reports/unit-contracts.log

      - name: Build
        run: pnpm build

      - name: Install isolated browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify original workbench recovery, diagnostics and bearer policies
        run: pnpm exec playwright test --config playwright.lines.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-line-workbench-tests
          include-hidden-files: true
          path: |
            frontend/test-results/
            frontend/.ci-reports/
          retention-days: 7
