name: Validate Beta Refactor

# Development checks deliberately do not publish or retag releases.
on:
  push:
    branches:
      - master
      - 'dev/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: DNS and IMS compatibility regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The binary crate has a large test graph. Keep full coverage while avoiding
    # local builds and unnecessary debug-info memory on the hosted runner.
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-checktests-nodebug-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-checktests-nodebug-cargo-v1-
      - name: Compile tests on Actions only
        working-directory: backend
        shell: bash
        run: |
          set +e
          cargo test --locked --no-run 2>&1 | tee beta-test-compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 ../.github/scripts/ci_failure_excerpt.py beta-test-compile.log "Beta test compilation failed"
          fi
          exit "$status"
      - name: Run hardware-free DNS and IMS regressions
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          # DB-store round trips are covered by config::tests; the text-file
          # module additionally checks insertion of nested default subtrees.
          for filter in \
            platform::dns::tests \
            platform::config::tests \
            platform::config_store::tests \
            platform::db::tests::legacy_volte_persisted_names_migrate_to_cellular_ims \
            platform::db::native_sms_inbox::tests \
            connectivity::core::sms_codec::tests \
            connectivity::core::sms_codec::modem_tests \
            platform::config_file::tests \
            platform::network_routing::tests \
            hardware::cellular::cgcontrdp::tests \
            hardware::cellular::bindings::tests \
            hardware::cellular::serial::tests \
            hardware::cellular::at_session::tests \
            hardware::cellular::at_urc::tests \
            hardware::cellular::observations::tests \
            hardware::cellular::mm_observations::tests \
            hardware::cellular::radio::tests \
            hardware::cellular::mm_radio::tests \
            hardware::cellular::backends::config::tests \
            hardware::cellular::backends::discovery::tests \
            hardware::cellular::backends::io::tests \
            hardware::cellular::backends::recovery::tests \
            hardware::cellular::backends::qmi_proxy::tests \
            hardware::sim::esim::process_lifecycle_tests \
            hardware::cellular::backends::protocol::tests \
            hardware::cellular::backends::native::tests \
            hardware::cellular::backends::messages::tests \
            hardware::cellular::backends::direct_sms::tests \
            hardware::cellular::backends::events::tests \
            hardware::cellular::backends::sim::tests \
            hardware::cellular::backends::sim_ledger::tests \
            connectivity::modems::ims::vowifi::qmi_uim::tests \
            connectivity::modems::ims::vowifi::qmi_uim::native_ledger_tests \
            hardware::cellular::backends::management::tests \
            hardware::devices::quectel::maintenance::tests \
            hardware::devices::dji::tests \
            hardware::cellular::backends::bearer::tests \
            services::messaging::sms_listener::tests \
            services::messaging::native_sms::tests \
            hardware::cellular::modem_manager::roaming_observation_tests \
            services::orchestrator::radio_intent::tests \
            services::automation::tasks::consume_data::tests \
            services::automation::tasks::dial_call::tests \
            services::automation::tasks::dial_outcome::tests \
            connectivity::core::ims_failure::tests \
            services::automation::scheduler::tests \
            services::automation::target::tests \
            services::line_registry::tests \
            services::line_registry::ims_startup_gate::tests \
            services::line_registry::line_inventory_tests \
            hardware::cellular::modem_manager::passive_inventory_tests \
            hardware::sim::esim::tests \
            services::ue_worker::tests \
            services::ue_netcfg::tests \
            connectivity::modems::ims::cellular_ims::identity::tests \
            connectivity::modems::ims::cellular_ims::plan::tests \
            connectivity::modems::ims::cellular_ims::bearer::tests \
            hardware::devices::qcm410::ims_bearer::tests \
            hardware::devices::qcm410::netdev::tests \
            hardware::devices::qcm410::primary_ims_session::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::switch_drain_tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::reconciliation::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::reconciliation_io::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::retirement::tests \
            hardware::devices::qcm410::primary_ims_settings::tests \
            hardware::devices::qcm410::primary_ims_pcscf::tests \
            hardware::devices::qcm410::primary_ims_pcscf::separated::tests \
            hardware::devices::qcm410::primary_ims_lifecycle::recovery::tests \
            hardware::devices::qcm410::secondary_qmi::tests \
            connectivity::modems::ims::cellular_ims::native_bearer::tests \
            connectivity::modems::ims::cellular_ims::data_slot::tests \
            connectivity::modems::ims::cellular_ims::runtime::tests \
            connectivity::modems::ims::cellular_ims::mm_binding::tests \
            connectivity::modems::ims::cellular_ims::pcscf::tests \
            connectivity::modems::ims::cellular_ims::pcscf_dns::tests \
            api::handlers::tests::cellular_ims_profile_batch \
            api::handlers::tests::blocked_line_projection_preserves_original_schema_and_saved_intents \
            api::handlers::tests::voice_home_ \
            connectivity::modems::ims::profile_override::tests \
            connectivity::modems::ims::effective_profile::tests \
            connectivity::core::device_identity::tests \
            connectivity::modems::ims::vowifi::epdg::tests \
            connectivity::modems::ims::vowifi::profile_record::tests \
            connectivity::modems::ims::vowifi::profiles::tests \
            connectivity::modems::ims::vowifi::profiles::cmcc_regression_tests \
            connectivity::modems::ims::vowifi::ike_state::tests \
            connectivity::modems::ims::vowifi::live::derived_hardening_tests \
            connectivity::modems::ims::vowifi::carrier_catalog::v7::tests \
            connectivity::modems::ims::vowifi::profile_store::tests \
            connectivity::modems::ims::vowifi::socks5::tests \
            connectivity::modems::ims::vowifi::transport::tests \
            connectivity::modems::ims::vowifi::live::epdg_address_tests \
            connectivity::modems::ims::vowifi::live::tests::full_handshake_keeps_proposal_and_transport_limits \
            services::trunk::transport::tests \
            services::trunk::access_router::tests \
            services::trunk::operator::tests \
            services::trunk::bridge::tests \
            services::orchestrator::voice_router::tests \
            services::orchestrator::sms_router \
            connectivity::modems::ims::cellular_ims::live::tests \
            connectivity::modems::ims::cellular_ims::live::security_hint::tests \
            connectivity::modems::ims::cellular_ims::live::register_failure_diagnostics::tests \
            connectivity::modems::ims::vowifi::operator::tests::incoming_cost_gate \
            connectivity::modems::ims::vowifi::operator::tests::two_dialogs_keep_progress_media_dtmf_and_reinvite_state_independent \
            services::e911::ssrf::tests \
            services::e911::ts43::tests \
            mm_startup_policy_tests \
            connectivity::core::register::tests \
            connectivity::core::outbound::tests \
            connectivity::core::ims_access::tests \
            connectivity::core::ims_registration_coordinator::tests \
            connectivity::modems::ims::vowifi::live::coexistence_lease_tests \
            connectivity::modems::ims::cellular_ims::channel::tests \
            connectivity::modems::ims::cellular_ims::ipsec::tests \
            connectivity::modems::ims::cellular_ims::live::refresh_tests \
            connectivity::modems::ims::cellular_ims::security_agreement::tests \
            connectivity::modems::ims::cellular_ims::errors::tests \
            services::notify::telegram_endpoint::tests; do
            cargo test --locked "$filter" -- --list > beta-test-list.txt
            if ! grep -q ': test$' beta-test-list.txt; then
              echo "::error title=Empty regression filter::$filter selected no tests"
              exit 1
            fi
            if ! cargo test --locked "$filter" -- --test-threads=1 2>&1 | tee -a beta-tests.log; then
              python3 ../.github/scripts/ci_failure_excerpt.py beta-tests.log "Beta regression failed"
              exit 1
            fi
          done
          grep -E 'running [0-9]+ test|test result:' beta-tests.log >> "$GITHUB_STEP_SUMMARY"
      - name: Check canonical and legacy API routes on a private bus
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          if ! dbus-run-session -- sh -c '
            set -eu
            export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS"
            for filter in retired_family_override_routes_cannot_modify_any_line cellular_ims_route_aliases_keep_auth_and_response_contract ims_registration_preference_api_preserves_cost_and_enable_settings http_router_tests::radio_intent_ http_router_tests::backend_selection_ hardware::devices::qcm410::primary_ims_lifecycle::ip_config_dbus_tests hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::dbus_tests hardware::devices::qcm410::primary_ims_lifecycle::profile_lease::runtime::dbus_tests hardware::cellular::mm_observations::dbus_tests; do
              cargo test --locked "$filter" -- --list > beta-api-test-list.txt
              grep -q ": test$" beta-api-test-list.txt
              cargo test --locked "$filter" -- --test-threads=1
            done
          ' 2>&1 | tee beta-api-tests.log; then
            python3 ../.github/scripts/ci_failure_excerpt.py beta-api-tests.log "Cellular IMS API compatibility failed"
            exit 1
          fi
      - name: Simulate standard and historical IMS registration on Actions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B offline-registration-sim/run.py \
            --report offline-registration-sim/ci-results/standard.json
          python3 -B offline-registration-sim/run.py --history \
            --report offline-registration-sim/ci-results/history.json
          python3 -B offline-registration-sim/run.py --security-hint \
            --report offline-registration-sim/ci-results/security-hint.json
          python3 -B offline-registration-sim/run.py --cmcc-regression \
            --report offline-registration-sim/ci-results/cmcc-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-refactor-tests
          path: |
            backend/beta-*.log
            offline-registration-sim/ci-results/
          retention-days: 7

  frontend:
    name: Frontend and release-policy checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run type-check
          pnpm run test:unit
